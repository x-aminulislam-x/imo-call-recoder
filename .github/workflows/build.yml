name: Build APK

# Builds a debug APK in the cloud so you do not need a local Android toolchain.
# Push, then grab the APK from the run's Artifacts section.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 actions: v4 targets Node 20, which runners now force onto Node 24
      # and which can crash actions that are not ready for it.
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step on purpose. The ubuntu-latest image already ships
      # the Android SDK with ANDROID_HOME set, so pulling in a third-party SDK
      # action only adds a step that can break.
      - name: Accept Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      # Invoking gradle directly rather than ./gradlew, because this project
      # ships without a wrapper JAR (a binary we cannot generate by hand).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
